# Builds an installable Android app (APK) from the files in /web.
# Run it from the Actions tab: "Build Android app" -> "Run workflow".
name: Build Android app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SlowBuild.apk

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: SlowBuild-apk
          path: SlowBuild.apk

      - name: Publish a download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Slow Build app (build ${{ github.run_number }})
          files: SlowBuild.apk
