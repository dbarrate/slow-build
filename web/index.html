<style>
html{-webkit-text-size-adjust:100%;color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){:root{color-scheme:dark}}

<style>
/* Layout: one calm column, one main action per screen, big tap targets for sweaty hands.
   Colour logic: blue = the app, orange = effort (jog), teal = recovery (walk). */
:root{
  --bg:#EEF0F4; --panel:#FFFFFF; --ink:#141925; --ink2:#556070; --line:#D8DDE6;
  --accent:#2B44D4; --on-accent:#FFFFFF; --soft:#E3E8FB;
  --jog:#C8420B; --on-jog:#FFFFFF; --walk:#0B7468; --on-walk:#FFFFFF; --good:#1B7F47; --warn:#8A5A00; --warn-bg:#FFF1CF;
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1117; --panel:#171C25; --ink:#ECEFF5; --ink2:#9AA5B8; --line:#262D3A;
    --accent:#8DA2FF; --on-accent:#0B1033; --soft:#1E2547;
    --jog:#FF8A4C; --on-jog:#1E0D03; --walk:#3FD1BE; --on-walk:#03201C; --good:#4CCB86; --warn:#F3C969; --warn-bg:#2E2512;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1117; --panel:#171C25; --ink:#ECEFF5; --ink2:#9AA5B8; --line:#262D3A;
  --accent:#8DA2FF; --on-accent:#0B1033; --soft:#1E2547;
  --jog:#FF8A4C; --on-jog:#1E0D03; --walk:#3FD1BE; --on-walk:#03201C; --good:#4CCB86; --warn:#F3C969; --warn-bg:#2E2512;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font:16px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px 120px;
}
.shell{max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 10px}
.brand{font:700 22px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase}
.chip{font:600 13px/1 var(--f-body);letter-spacing:.04em;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--accent);white-space:nowrap}
h1{font:700 36px/1.02 var(--f-display);letter-spacing:.01em;margin:8px 0 8px;text-wrap:balance}
h2{font:600 12.5px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:24px 0 8px}
p{margin:0 0 10px}
.lead{color:var(--ink2);font-size:17px}
.muted{color:var(--ink2);font-size:14px}
.eyebrow{font:600 13px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-top:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.center{text-align:center}
.stack{display:grid;gap:10px}
.two{grid-template-columns:1fr 1fr}
.btn{min-height:54px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 17px/1.1 var(--f-body);padding:8px 18px;width:100%;cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.link:focus-visible,.tab:focus-visible,.sq:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.link{background:none;border:0;color:var(--accent);font:500 15px var(--f-body);padding:10px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link.plain{color:var(--ink2)}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.bigtime{font-size:76px;line-height:1;font-weight:600;letter-spacing:.01em;margin:6px 0 12px}
.steps{display:flex;gap:4px;margin:4px 0 2px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--accent)}
.steps span.cur{background:var(--ink2)}
.wtop{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
ul.plan,ul.cues{list-style:none;margin:0;padding:0}
ul.plan li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
ul.plan li:first-child{border-top:0}
ul.plan .r{color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums;flex:none}
ul.plan .l{min-width:0}
ul.cues li{padding:5px 0 5px 22px;position:relative}
ul.cues li::before{content:"";position:absolute;left:4px;top:13px;width:8px;height:8px;border-radius:2px;background:var(--accent)}
.days{display:flex;gap:8px;margin:2px 0 12px}
.days span{flex:1;height:8px;border-radius:2px;background:var(--line)}
.days .d{background:var(--good)}
.days .c{background:var(--accent)}
.note{border-radius:8px;padding:10px 12px;margin:10px 0;font-size:15px;background:var(--soft);color:var(--ink)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.up{background:var(--soft);color:var(--accent);font-weight:600}
.target{font:600 22px/1.1 var(--f-display);letter-spacing:.02em;margin:12px 0 4px}
.load{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center;margin:10px 0}
.sq{width:56px;height:56px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 28px/1 var(--f-body);cursor:pointer}
.load .mid{text-align:center}
.load input{width:100%;max-width:130px;text-align:center;font:600 34px/1 var(--f-display);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 4px}
.load .u{display:block;font-size:13px;color:var(--ink2);margin-top:3px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--panel);min-height:56px}
.setrow.idle{opacity:.5}
.setrow.done{color:var(--good);border-color:var(--good)}
.setrow.done .num{font-size:20px;color:var(--ink)}
.setrow.cur{border-color:var(--accent);flex-wrap:wrap}
.rep{display:flex;align-items:center;gap:10px}
.rep b{font:600 34px/1 var(--f-display);min-width:48px;text-align:center}
.rep small{color:var(--ink2);font-size:13px}
.phase{border-radius:14px;padding:26px 16px 20px;text-align:center;margin-top:12px}
.phase.jog{background:var(--jog);color:var(--on-jog)}
.phase.walk{background:var(--walk);color:var(--on-walk)}
.phase .pl{font:700 30px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase}
.phase .bigtime{font-size:96px;margin:8px 0 6px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.rest{border:1px dashed var(--ink2);border-radius:8px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.rest .num{font-size:34px;font-weight:600}
.rest .btn{width:auto;min-height:44px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stats b{display:block;font-size:30px;line-height:1.05;font-weight:700}
.stats span{font-size:13px;color:var(--ink2)}
.lad{display:grid;grid-template-columns:26px 1fr;gap:2px 10px;align-items:center;padding:6px 0}
.lad .ln{font-size:18px;color:var(--ink2)}
.lad .lb{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.lad .lb i{display:block;height:100%;background:var(--ink2);border-radius:3px}
.lad .lt{grid-column:2;font-size:13.5px;color:var(--ink2)}
.lad.past .lb i{background:var(--good)}
.lad.now .lb i{background:var(--jog)}
.lad.now .lt,.lad.now .ln{color:var(--ink);font-weight:600}
.hist{padding:10px 0;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg .btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
textarea{width:100%;min-height:130px;font:16px/1.4 var(--f-body);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical}
.tags{display:inline-block;font-size:12.5px;font-weight:600;color:var(--good);border:1px solid var(--good);border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap}
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:6px;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tab{flex:1;min-height:50px;border:0;border-radius:8px;background:transparent;color:var(--ink2);font:600 14px/1.1 var(--f-body);letter-spacing:.04em;cursor:pointer}
.tab.on{background:var(--soft);color:var(--accent)}
details.how{border-top:1px solid var(--line);padding:2px 0}
details.how summary,details.lift summary{cursor:pointer;list-style:none}
details.how summary::-webkit-details-marker,details.lift summary::-webkit-details-marker{display:none}
details.how summary{font:600 15px var(--f-body);padding:11px 0;display:flex;justify-content:space-between;align-items:center;min-height:44px}
details.how summary::after,details.lift summary::after{content:"+";font:600 22px/1 var(--f-body);color:var(--ink2);margin-left:10px}
details.how[open] summary::after,details.lift[open] summary::after{content:"−"}
details.how:last-of-type{border-bottom:1px solid var(--line)}
.hl{margin:0 0 10px;padding-left:22px}
.hl li{padding:3px 0}
details.lift{border-top:1px solid var(--line);padding:2px 0 10px}
details.lift:first-child{border-top:0}
details.lift summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;min-height:56px}
details.lift summary::after{margin-left:0}
.lname{display:block;min-width:0;flex:1}
.lsub{display:block;font-size:13px;color:var(--ink2);margin-top:2px}
.lcur{font-size:24px;font-weight:600;white-space:nowrap}
@media (prefers-reduced-motion: no-preference){.bar i{transition:width .4s linear}}
</style>
</head>
<body>
<div class="shell">
  <header class="top"><span class="brand">Slow Build</span><span class="chip" id="wkchip">Week 1</span></header>

  <button class="tab" data-act="tab" data-v="progress">Progress</button>

</nav>

/* ---------- state ---------- */

// Version 1 used a different exercise list. Keep the workout count, cardio level and settings; restart the lifts.
function migrate(o){if(o&&o.v===1){o.v=2;o.ex={};o.opt={};o.wip=null;o.hist={};o.seen={};}return o;}
var S=fresh(), W=null, R=null, view='today', curVal=null, confirmReset=false, confirmDiscard=false, LAST=null;

var saveTimer=null, writing=false, dirty=false, fails=0;
function save(){
  S.t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,900);
}
function flush(){
  if(!dbDoc||writing||!dirty) return;
  writing=true; dirty=false;
  dbDoc.set(JSON.parse(JSON.stringify(S))).then(function(){fails=0;writing=false;if(dirty){saveTimer=setTimeout(flush,900);}},
    function(){writing=false;fails++;if(fails<4){dirty=true;saveTimer=setTimeout(flush,3000*fails);}else{dbState='local';}});
}

/* ---------- helpers ---------- */
function weekNo(){return Math.floor(S.done/3)+1;}

function incOf(slot){return S.unit==='lb'?slot.inc[0]:slot.inc[1];}
function r2(n){return Math.round(n*100)/100;}
function num(n){return String(r2(n));}
function mmss(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);}
function words(s){if(s<60)return s+' s';var m=Math.floor(s/60),r=s%60;return r?m+' min '+r+' s':m+' min';}
function cLabel(lv){var c=CARDIO[lv];return c.w?('Jog '+words(c.j)+', walk '+words(c.w)+', '+c.r+' times'):('Jog '+words(c.j)+' straight');}
function cMinutes(lv){var c=CARDIO[lv];return Math.round((c.j*c.r+c.w*(c.r-1))/60);}
function setText(sel,t){var e=$(sel);if(e)e.textContent=t;}
var ac=null;
function unlockAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}}
function beep(f,ms){try{if(!ac)return;var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f||880;g.gain.value=0.09;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+(ms||200)/1000);}catch(e){}}
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p||[150]);}catch(e){}}
var wake=null;
function keepAwake(){try{if(navigator.wakeLock&&!wake){navigator.wakeLock.request('screen').then(function(l){wake=l;l.addEventListener('release',function(){wake=null;});},function(){});}}catch(e){}}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&W)keepAwake();});

/* ---------- progression ---------- */
function slotPlan(slot,wk){
  var oi=S.opt[slot.id]||0,o=slot.opts[oi],key=slot.id+':'+oi,s0=S.ex[key]||{},deload=wk%4===0;
  var load=(s0.load!=null)?s0.load:(o.bw?0:null);
  var target=(s0.target!=null)?s0.target:(slot.kind==='reps'?6:slot.kind==='time'?15:null);
  var bump=null,hint=null;
  if(s0.ready&&wk>Math.max(s0.lastUp||0,1)&&!deload){
    if(slot.kind==='load'){
      if(o.bw&&!(load>0)){hint='You have outgrown this version. Swap to the next one, or hold a dumbbell and add weight.';}
      else if(load!=null){var st=incOf(slot);var nl=r2(load+st);bump=num(load)+' → '+num(nl)+' '+S.unit;load=nl;}
    }else if(slot.kind==='reps'&&target<12){bump=target+' → '+(target+1)+' reps';target+=1;}
    else if(slot.kind==='time'&&target<60){bump=target+' → '+(target+5)+' s';target+=5;}
  }
  return {sid:slot.id,oi:oi,key:key,load:load,target:target,sets:(deload||wk<3)?2:3,bump:bump,hint:hint};
}
function commit(p,wk){
  var st=S.ex[p.key]||(S.ex[p.key]={load:p.load,target:p.target,ready:false,lastUp:0});
  if(p.bump){st.load=p.load;st.target=p.target;st.ready=false;st.lastUp=wk;}
  else{if(st.load==null&&p.load!=null)st.load=p.load;if(st.target==null&&p.target!=null)st.target=p.target;}
}
function startSession(){
  var wk=weekNo(),dk=dayKey();
  var plan=daySlots(dk).map(function(s){return slotPlan(s,wk);});
  plan.forEach(function(p){commit(p,wk);});
  var C=S.cardio,cBump=false;
  if(C.ready&&wk>Math.max(C.lastUp,1)&&wk%4!==0&&C.level<MAXC){C.level++;C.ok=0;C.ready=false;C.lastUp=wk;cBump=true;}
  W=S.wip={day:dk,week:wk,step:0,plan:plan,logs:{},cLevel:C.level,cBump:cBump,cRounds:0,cFeel:null,rating:null};
  save();keepAwake();
}
function finish(){
  var wk=W.week,rating=W.rating,rec={date:new Date().toISOString(),day:W.day,week:wk,rating:rating,ex:[],cardio:null};
  var ups=[];
  W.plan.forEach(function(p){
    var slot=slotById(p.sid),o=slot.opts[p.oi],lg=W.logs[p.key];
    if(!lg||!lg.sets.length){rec.ex.push({n:o.n,skip:true});var s0=S.ex[p.key];if(s0)s0.ready=false;return;}
    var st=S.ex[p.key]||(S.ex[p.key]={load:p.load,target:p.target,ready:false,lastUp:0});
    var vals=lg.sets.map(function(s){return s.v;}),complete=vals.length>=p.sets,avg=vals.reduce(function(a,b){return a+b;},0)/vals.length;
    var last=lg.sets[lg.sets.length-1];
    rec.ex.push({n:o.n,v:vals,ld:slot.kind==='load'?last.ld:null});
    var hl=S.hist[p.key]||(S.hist[p.key]=[]);
    hl.push({w:wk,d:rec.date,ld:slot.kind==='load'?last.ld:null,v:vals});
    if(hl.length>40)S.hist[p.key]=hl.slice(-40);
    S.seen[p.key]=1;
    if(slot.kind==='load'){
      var allTop=complete&&vals.every(function(v){return v>=12;});
      st.ready=allTop&&rating!=='hard';
      if(avg<6&&(st.load||0)>0){st.load=Math.max(0,r2(st.load-incOf(slot)));st.ready=false;}
      if(st.ready)ups.push(o.n);
    }else{
      var tg=p.target;
      st.ready=complete&&vals.every(function(v){return v>=tg;})&&rating!=='hard'&&(slot.kind==='reps'?tg<12:tg<60);
      if(st.ready)ups.push(o.n);
    }
  });
  var C=S.cardio,cmsg='';
  if(W.cFeel){
    var c=CARDIO[W.cLevel],total=c.r,rounds=W.cRounds,completed=rounds>=total;
    rec.cardio={level:W.cLevel,rounds:rounds,total:total,feel:W.cFeel};
    if(completed&&W.cFeel==='easy'){C.ready=true;C.ok=0;cmsg='Cardio felt easy. It steps up next week.';}
    else if(completed&&W.cFeel==='ok'){C.ok++;if(C.ok>=2){C.ready=true;cmsg='Two solid sessions at this level. Cardio steps up next week.';}else{cmsg='Good. One more solid session at this level and it steps up.';}}
    else if(completed){C.ok=0;C.ready=false;cmsg='Finished, but it was very hard. Same level next time.';}
    else if(rounds<Math.ceil(total/2)){C.level=Math.max(1,C.level-1);C.ok=0;C.ready=false;cmsg='That was too much. Cardio drops one step so you can build it back.';}
    else{C.ok=0;C.ready=false;cmsg='You stopped early. Same level next time.';}
  }
  S.sessions.push(rec);if(S.sessions.length>80)S.sessions=S.sessions.slice(-80);
  S.done++;S.wip=null;W=null;R=null;
  LAST={ups:ups,cmsg:cmsg,rec:rec,cardioReady:C.ready};
  save();
  try{if(wake){wake.release();wake=null;}}catch(e){}
}

  return h;

}
function cardioTotalSec(c){return c.j*c.r+c.w*(c.r-1);}
function buildPhases(c){var ph=[];for(var r=0;r<c.r;r++){ph.push({t:'jog',s:c.j});if(c.w&&r<c.r-1)ph.push({t:'walk',s:c.w});}return ph;}
function remTotal(rem){var t=rem;for(var i=R.idx+1;i<R.phases.length;i++)t+=R.phases[i].s;return t;}
function cardioView(){
  var c=CARDIO[W.cLevel];
  if(R&&R.kind==='cardio'){
    if(R.done){
      return '<h1>Intervals done</h1><p class="lead">'+W.cRounds+' of '+c.r+' jogs finished. How did that feel?</p><div class="stack">'+
        '<button class="btn" data-act="feel" data-v="easy">Easy. I could have done more.</button>'+
        '<button class="btn" data-act="feel" data-v="ok">Hard, but I got through it.</button>'+
        '<button class="btn" data-act="feel" data-v="hard">Very hard. I barely made it.</button></div>';
    }
    var ph=R.phases[R.idx],rem=R.paused?R.remain:Math.max(0,Math.ceil((R.end-Date.now())/1000));
    var round=c.w?Math.floor(R.idx/2)+1:R.idx+1,nx=R.phases[R.idx+1];
    var pct=Math.min(100,Math.round((1-remTotal(rem)/R.total)*100));
    return '<div class="phase '+ph.t+'"><div class="pl">'+(ph.t==='jog'?'Jog':'Walk')+'</div><div class="bigtime num" id="tm">'+mmss(rem)+'</div><div id="rd">Round '+round+' of '+c.r+'</div></div>'+
      '<div class="bar"><i id="pb" style="width:'+pct+'%"></i></div>'+
      '<p class="muted" id="nx">'+(nx?('Next: '+(nx.t==='jog'?'jog':'walk')+' for '+words(nx.s)):'Last stretch. Then cool down.')+'</p>'+
      '<div class="stack two">'+(R.paused?'<button class="btn primary" data-act="cresume">Resume</button>':'<button class="btn" data-act="cpause">Pause</button>')+'<button class="btn" data-act="cstop">Stop early</button></div>';
  }
  var h='<h1>Cardio intervals</h1><p class="lead">'+cLabel(W.cLevel)+'. About '+cMinutes(W.cLevel)+' minutes.</p>';
  if(W.cBump)h+='<div class="note up">Cardio stepped up this week.</div>';
  h+='<div class="card"><ul class="cues"><li>Jog slowly, a pace where you could say a short sentence.</li><li>Walk to fully recover. Do not skip the walks.</li><li>The phone will beep and buzz when it is time to switch.</li></ul></div>';
  h+='<div class="stack" style="margin-top:12px"><button class="btn primary" data-act="cstart">Start</button><button class="link plain" data-act="cskip">Skip cardio today</button></div>';
  return h;
}
function rateView(){
  return '<h1>All done</h1><p class="lead">How did today feel overall? This decides what moves up next.</p><div class="stack">'+
    '<button class="btn" data-act="rate" data-v="easy">Easy</button><button class="btn" data-act="rate" data-v="right">About right</button><button class="btn" data-act="rate" data-v="hard">Hard</button></div>';
}
function workoutView(){
  var st=W.step,dots='';
  for(var i=0;i<8;i++)dots+='<span class="'+(i<st?'on':i===st?'cur':'')+'"></span>';
  var id=[ 'warm',0,1,2,3,'cardio','cool','rate' ][st],body;
  if(id==='warm')body=warmView();else if(id==='cool')body=coolView();else if(id==='cardio')body=cardioView();else if(id==='rate')body=rateView();else body=exView(id);
  return '<div class="steps">'+dots+'</div><div class="wtop"><span class="chip">Week '+W.week+' · '+dayTitle(W.day)+'</span><button class="link plain" data-act="leave">Save and leave</button></div>'+body;
}
function doneView(){
  var r=LAST.rec,h='<div class="eyebrow">Workout '+S.done+' complete</div><h1>Nice work.</h1>';
  var logged=r.ex.filter(function(e){return !e.skip;}).length;
  h+='<div class="card"><ul class="plan"><li><span class="l">Strength</span><span class="r">'+logged+' of '+r.ex.length+' exercises</span></li>'+
     '<li><span class="l">Cardio</span><span class="r">'+(r.cardio?r.cardio.rounds+' of '+r.cardio.total+' jogs':'skipped')+'</span></li></ul></div>';
  if(LAST.cmsg)h+='<div class="note">'+esc(LAST.cmsg)+'</div>';
  if(LAST.ups.length)h+='<div class="note up">Ready to go up: '+LAST.ups.map(esc).join(', ')+'.</div>';
  h+='<p class="muted">Next: Week '+weekNo()+', Day '+((S.done%3)+1)+' (' +dayTitle(dayKey())+'). Rest a day or two between sessions.</p>';
  h+='<div class="stack"><button class="btn primary" data-act="home">Back to Today</button></div>';
  return h;
}
function spark(vals,weeks){
  var W2=300,H2=84,pl=38,pr=10,pt=10,pb=18,n=vals.length;
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals),slo=lo,shi=hi;
  if(lo===hi){slo=lo-1;shi=hi+1;}
  function X(i){return n===1?(pl+(W2-pl-pr)/2):pl+(W2-pl-pr)*i/(n-1);}
  function Y(v){return pt+(H2-pt-pb)*(1-(v-slo)/(shi-slo));}
  var pts=vals.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1);}).join(' ');
  var g='<svg viewBox="0 0 '+W2+' '+H2+'" width="100%" role="img" aria-label="Progress over time" style="display:block">';
  g+='<line x1="'+pl+'" y1="'+Y(hi).toFixed(1)+'" x2="'+(W2-pr)+'" y2="'+Y(hi).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
  g+='<text x="'+(pl-6)+'" y="'+(Y(hi)+3.5).toFixed(1)+'" text-anchor="end" font-size="10" fill="var(--ink2)">'+num(hi)+'</text>';
  if(lo!==hi){
    g+='<line x1="'+pl+'" y1="'+Y(lo).toFixed(1)+'" x2="'+(W2-pr)+'" y2="'+Y(lo).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
    g+='<text x="'+(pl-6)+'" y="'+(Y(lo)+3.5).toFixed(1)+'" text-anchor="end" font-size="10" fill="var(--ink2)">'+num(lo)+'</text>';
  }
  if(n>1)g+='<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  vals.forEach(function(v,i){g+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+(i===n-1?4.5:3)+'" fill="var(--accent)"/>';});
  g+='<text x="'+pl+'" y="'+(H2-3)+'" font-size="10" fill="var(--ink2)">wk '+weeks[0]+'</text>';
  if(n>1)g+='<text x="'+(W2-pr)+'" y="'+(H2-3)+'" text-anchor="end" font-size="10" fill="var(--ink2)">wk '+weeks[n-1]+'</text>';
  return g+'</svg>';
}
function liftCard(slot){
  var oi=S.opt[slot.id]||0,o=slot.opts[oi],key=slot.id+':'+oi,s=S.ex[key]||{},hs=S.hist[key]||[];
  var cur;
  if(slot.kind==='load')cur=(s.load==null?(o.bw?'Bodyweight':'Not set'):(s.load>0?num(s.load)+' '+S.unit:'Bodyweight'));
  else if(slot.kind==='reps')cur=(s.target||6)+' reps';else cur=(s.target||15)+' s';
  var series=hs.map(function(x){return slot.kind==='load'?(x.ld||0):Math.max.apply(null,x.v);});
  var sub='';
  if(slot.kind==='load'&&hs.length>=2){var d=r2(series[series.length-1]-series[0]);sub=(d>0?'+':'')+num(d)+' '+S.unit+' since week '+hs[0].w;}
  else if(!hs.length)sub='No sessions yet';
  else if(hs.length===1)sub='1 session logged';
  else sub=hs.length+' sessions logged';
  var h='<details class="lift"><summary><span class="lname">'+esc(o.n)+(s.ready?'<span class="tags">ready to go up</span>':'')+'<span class="lsub">'+esc(sub)+'</span></span><span class="num lcur">'+esc(cur)+'</span></summary>';
  if(hs.length){
    h+=spark(series,hs.map(function(x){return x.w;}));
    h+='<ul class="plan" style="margin-top:6px">'+hs.slice(-6).reverse().map(function(x){
      var d=new Date(x.d).toLocaleDateString(undefined,{month:'short',day:'numeric'});
      return '<li><span class="l">Week '+x.w+' · '+d+'</span><span class="r">'+esc(histText(slot,x))+'</span></li>';}).join('')+'</ul>';
  }else h+='<p class="muted" style="margin:8px 0 0">Your weights will show up here after your first workout.</p>';
  return h+'</details>';
}
function liftsView(){
  var h='<h1>Lifts</h1><p class="lead">Your weight on every exercise, week by week. Tap one to see the chart.</p>';
  ['L','P','B'].forEach(function(k){
    h+='<h2>'+esc(DAYS[k].name)+'</h2><div class="card" style="padding:4px 16px">'+daySlots(k).map(liftCard).join('')+'</div>';
  });
  return h;
}
function progressView(){
  var c=CARDIO[S.cardio.level];
  var h='<h1>Progress</h1><div class="stats"><div><b class="num">'+S.done+'</b><span>workouts</span></div><div><b class="num">'+weekNo()+'</b><span>week</span></div><div><b class="num">'+esc(words(c.j))+'</b><span>jog stretch</span></div></div>';
  h+='<h2>Cardio ladder</h2><div class="card">'+CARDIO.slice(1).map(function(cc,i){
    var L=i+1,cls=L<S.cardio.level?'past':L===S.cardio.level?'now':'',w=Math.max(4,Math.round(Math.sqrt(cc.j/1200)*100));
    return '<div class="lad '+cls+'"><span class="ln num">'+L+'</span><div class="lb"><i style="width:'+w+'%"></i></div><span class="lt">Jog '+words(cc.j)+(cc.w?' / walk '+words(cc.w):'')+' × '+cc.r+'</span></div>';}).join('')+'</div>';
  h+='<h2>Recent workouts</h2>';
  if(!S.sessions.length)h+='<p class="muted">Nothing logged yet. Your first workout will show up here.</p>';
  else h+='<div class="card">'+S.sessions.slice(-10).reverse().map(function(r){
    var d=new Date(r.date).toLocaleDateString(undefined,{month:'short',day:'numeric'});
    var done=r.ex.filter(function(e){return !e.skip;}).length;
    return '<div class="hist"><b>'+d+'</b> · Week '+r.week+', '+dayTitle(r.day)+'<br><span class="muted">'+done+' of '+r.ex.length+' exercises'+(r.cardio?' · '+r.cardio.rounds+'/'+r.cardio.total+' jogs':'')+'</span></div>';}).join('')+'</div>';
  return h;
}
function gymView(){
  var h='<h1>My gym</h1><p class="lead">Type the machines your gym has. When you are ready, tell me in chat and I will rebuild the exercise list around them.</p>';
  h+='<textarea id="gymnotes" placeholder="Leg press, chest press, lat pulldown, treadmill...">'+esc(S.gym||'')+'</textarea>';
  h+='<h2>Units</h2><div class="seg"><button class="btn '+(S.unit==='lb'?'on':'')+'" data-act="unit" data-u="lb"'+(W?' disabled':'')+'>lb</button><button class="btn '+(S.unit==='kg'?'on':'')+'" data-act="unit" data-u="kg"'+(W?' disabled':'')+'>kg</button></div>';
  h+='<h2>Cardio level</h2><div class="load"><button class="sq" data-act="clm"'+(W?' disabled':'')+' aria-label="Lower cardio level">−</button><div class="mid"><div class="num" style="font-size:34px;font-weight:600">'+S.cardio.level+'</div><span class="u muted">'+cLabel(S.cardio.level)+'</span></div><button class="sq" data-act="clp"'+(W?' disabled':'')+' aria-label="Raise cardio level">+</button></div>';
  h+='<p class="muted">The app moves this for you. Change it by hand only if the level feels clearly wrong.</p>';
  h+='<h2>Your data</h2><p class="muted">Everything is saved on this phone only. Make a backup now and then. If you clear your browser data, a backup file lets you restore your progress.</p>';
  h+='<div class="stack two" style="margin-bottom:10px"><button class="btn" data-act="backup">Save backup</button><label class="btn" for="restorefile" style="display:flex;align-items:center;justify-content:center">Restore backup</label></div><input id="restorefile" type="file" accept="application/json,.json" hidden>';
  h+='<button class="btn" data-act="reset">'+(confirmReset?'Tap again to erase everything':'Start over')+'</button>';
  return h;
}
function render(scroll){
  var a=$('#app'),inW=!!W&&view==='workout';
  if(view==='done'&&LAST)a.innerHTML=doneView();
  else if(inW)a.innerHTML=workoutView();
  else{if(view==='workout')view='today';a.innerHTML=(view==='progress'?progressView:view==='lifts'?liftsView:view==='gym'?gymView:todayView)();}
  $('#tabs').hidden=inW||view==='done';
  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++)tabs[i].classList.toggle('on',tabs[i].dataset.v===view);
  setText('#wkchip','Week '+weekNo());
  if(scroll)window.scrollTo(0,0);
}

/* ---------- timers ---------- */
function advanceCardio(){
  var changed=false;
  while(!R.done&&R.end<=Date.now()){
    var ph=R.phases[R.idx];if(ph.t==='jog')W.cRounds++;
    R.idx++;
    if(R.idx>=R.phases.length){R.done=true;}else R.end+=R.phases[R.idx].s*1000;
    changed=true;
  }
  return changed;
}
function tick(){
  if(!R||R.paused||R.done)return;
  if(R.kind==='cardio'){
    if(advanceCardio()){beep(R.done?660:880,260);buzz(R.done?[300,100,300]:[200]);save();render();return;}
    var rem=Math.max(0,Math.ceil((R.end-Date.now())/1000));
    setText('#tm',mmss(rem));var pb=$('#pb');if(pb)pb.style.width=Math.min(100,Math.round((1-remTotal(rem)/R.total)*100))+'%';
    return;
  }
  var rm=Math.max(0,Math.ceil((R.end-Date.now())/1000));
  if(rm<=0){
    R.done=true;beep(880,300);buzz([250,100,250]);
    if(R.kind==='hold'){var i=R.i;pushSet(i,R.total);return;}
    render();return;
  }
  setText('#tm',mmss(rm));
}
setInterval(tick,250);

/* ---------- actions ---------- */
function pushSet(i,v){
  var p=W.plan[i],slot=slotById(p.sid),lg=W.logs[p.key]||(W.logs[p.key]={sets:[]});
  lg.sets.push({v:v,ld:slot.kind==='load'?p.load:null});
  curVal=null;
  R=(lg.sets.length<p.sets)?{kind:'rest',total:slot.rest,end:Date.now()+slot.rest*1000,paused:false,done:false}:null;
  save();render();
}
function setLoad(i,v){
  var p=W.plan[i],slot=slotById(p.sid);
  if(v==null||isNaN(v)){return;}
  v=Math.max(0,r2(v));p.load=v;
  var st=S.ex[p.key]||(S.ex[p.key]={load:v,target:p.target,ready:false,lastUp:0});
  st.load=v;if(v>0&&slot.opts[p.oi].bw)st.ready=false;
  save();render();
}
function nextStep(){W.step++;R=null;curVal=null;save();render(true);}
function act(a,d){
  switch(a){
    case 'tab':view=d.v;confirmReset=false;confirmDiscard=false;render(true);break;
    case 'start':if(!W)startSession();view='workout';render(true);break;
    case 'leave':view='today';R=null;render(true);break;
    case 'home':view='today';LAST=null;render(true);break;
    case 'discard':if(confirmDiscard){W=S.wip=null;R=null;confirmDiscard=false;save();}else confirmDiscard=true;render();break;
    case 'next':nextStep();break;
    case 'skipex':nextStep();break;
    case 'swap':{var i=+d.i,p=W.plan[i],slot=slotById(p.sid);S.opt[slot.id]=((S.opt[slot.id]||0)+1)%slot.opts.length;var np=slotPlan(slot,W.week);commit(np,W.week);W.plan[i]=np;save();render();break;}
    case 'ldm':case 'ldp':{var i2=+d.i,p2=W.plan[i2],sl=slotById(p2.sid),st=incOf(sl),cur=p2.load;
      if(cur==null){setLoad(i2,st*2);}else setLoad(i2,a==='ldp'?cur+st:Math.max(0,cur-st));break;}
    case 'vm':case 'vp':{var i3=+d.i,sl3=slotById(W.plan[i3].sid),v=(curVal==null?curDefault(i3):curVal)+(a==='vp'?1:-1);curVal=Math.max(1,Math.min(60,v));setText('#cv',curVal);break;}
    case 'logset':{var i4=+d.i;pushSet(i4,curVal==null?curDefault(i4):curVal);break;}
    case 'holdstart':{var i5=+d.i,p5=W.plan[i5];unlockAudio();R={kind:'hold',i:i5,total:p5.target,start:Date.now(),end:Date.now()+p5.target*1000,paused:false,done:false};render();break;}
    case 'holdstop':{var el=Math.max(1,Math.round((Date.now()-R.start)/1000));var i6=R.i;pushSet(i6,Math.min(el,R.total));break;}
    case 'rest15':if(R&&R.kind==='rest'){if(R.done){R.done=false;R.end=Date.now()+15000;}else R.end+=15000;render();}break;
    case 'restskip':R=null;render();break;
    case 'tstart':unlockAudio();R={kind:d.kind,total:+d.total,end:Date.now()+d.total*1000,paused:false,done:false};render();break;
    case 'tpause':R.paused=true;R.remain=Math.max(0,Math.ceil((R.end-Date.now())/1000));render();break;
    case 'tresume':R.paused=false;R.end=Date.now()+R.remain*1000;render();break;
    case 'cstart':{unlockAudio();var c=CARDIO[W.cLevel],ph=buildPhases(c);W.cRounds=0;R={kind:'cardio',phases:ph,idx:0,end:Date.now()+ph[0].s*1000,total:cardioTotalSec(c),paused:false,done:false};beep(880,200);buzz();render();break;}
    case 'cpause':R.paused=true;R.remain=Math.max(0,Math.ceil((R.end-Date.now())/1000));render();break;
    case 'cresume':R.paused=false;R.end=Date.now()+R.remain*1000;render();break;
    case 'cstop':W.cFeel='hard';nextStep();break;
    case 'cskip':W.cFeel=null;W.cRounds=0;nextStep();break;
    case 'feel':W.cFeel=d.v;nextStep();break;
    case 'rate':W.rating=d.v;finish();view='done';render(true);break;
    case 'backup':exportData();break;
    case 'unit':{if(W||d.u===S.unit)break;var f=d.u==='kg'?0.45359237:2.2046226,step=d.u==='kg'?2.5:5;
      Object.keys(S.ex).forEach(function(k){var s=S.ex[k];if(s.load>0)s.load=Math.max(step,Math.round(s.load*f/step)*step);});
      Object.keys(S.hist).forEach(function(k){S.hist[k].forEach(function(x){if(x.ld>0)x.ld=Math.max(step,Math.round(x.ld*f/step)*step);});});
      S.unit=d.u;save();render();break;}
    case 'clm':case 'clp':if(!W){S.cardio.level=Math.max(1,Math.min(MAXC,S.cardio.level+(a==='clp'?1:-1)));S.cardio.ok=0;S.cardio.ready=false;save();render();}break;
    case 'reset':if(confirmReset){var keep=S.gym;S=fresh();S.gym=keep;W=null;R=null;LAST=null;confirmReset=false;view='today';save();}else confirmReset=true;render(true);break;
  }
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  if(!b.classList.contains('tab')&&b.dataset.act!=='reset'){confirmReset=false;}
  act(b.dataset.act,b.dataset);
});
document.addEventListener('change',function(e){
  if(e.target.id==='ld'&&W){var v=parseFloat(e.target.value);if(!isNaN(v))setLoad(+e.target.dataset.i,v);}
});
document.addEventListener('input',function(e){
  if(e.target.id==='gymnotes'){S.gym=e.target.value.slice(0,4000);save();}
});

/* ---------- backup / restore ---------- */
function exportData(){
  try{
    var blob=new Blob([JSON.stringify(S)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='slow-build-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  }catch(e){alert('Could not create the backup file.');}
}
function importData(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var o=JSON.parse(fr.result);
      if(!o||(o.v!==1&&o.v!==2)||typeof o.done!=='number')throw new Error('bad');
      o=migrate(o);S=Object.assign(fresh(),o);W=S.wip||null;R=null;view='today';save();render(true);
    }catch(e){alert('That file is not a Slow Build backup.');}
  };
  fr.readAsText(file);
}
document.addEventListener('change',function(e){
  if(e.target.id==='restorefile'&&e.target.files&&e.target.files[0]){importData(e.target.files[0]);e.target.value='';}
});

/* ---------- boot ---------- */
var local=loadLocal();
if(local){S=Object.assign(fresh(),local);W=S.wip||null;}
render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
})();
</script>
